<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Gestor de Ciudadanos (JSF)</title>
</h:head>
<h:body>
    <h1>Gestor de Ciudadanos - JSF</h1>

    <h:form id="formAlta">
        <h2>Agregar Ciudadano</h2>

        <h:panelGrid columns="2">
            <h:outputLabel for="cedula" value="Cedula (8 digitos):"/>
            <h:inputText id="cedula" value="#{ciudadanoBean.cedula}" required="true"/>

            <h:outputLabel for="correo" value="Correo:"/>
            <h:inputText id="correo" value="#{ciudadanoBean.correo}" required="true"/>

            <h:outputLabel for="fecha" value="Fecha primer login:"/>
            <h:inputText id="fecha" value="#{ciudadanoBean.fecha}" required="true">
                <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
            </h:inputText>
        </h:panelGrid>

        <h:commandButton value="Agregar" action="#{ciudadanoBean.agregar}">
            <!-- AJAX: al procesar, no recarga la pagina, solo actualiza
                 el mensaje y la tabla, referenciados por su id -->
            <f:ajax execute="@form" render="mensaje tablaCiudadanos"/>
        </h:commandButton>

        <h:outputText id="mensaje" value="#{ciudadanoBean.mensaje}" style="font-weight:bold; display:block;"/>
    </h:form>

    <h2>Listado</h2>
    <h:dataTable id="tablaCiudadanos" value="#{ciudadanoBean.ciudadanos}" var="c" border="1">
        <h:column>
            <f:facet name="header">Cedula</f:facet>
            #{c.cedula}
        </h:column>
        <h:column>
            <f:facet name="header">Correo</f:facet>
            #{c.correoElectronico}
        </h:column>
        <h:column>
            <f:facet name="header">Fecha primer login</f:facet>
            #{c.fechaPrimerLogin}
        </h:column>
    </h:dataTable>
</h:body>
</html>
